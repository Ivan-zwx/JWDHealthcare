<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar">
    <div class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-semibold" th:href="@{/}" th:text="#{app.shortTitle}">
                Healthcare Scheduler
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" th:attr="aria-label=#{nav.toggle}">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div id="mainNavbar" class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" th:text="#{nav.home}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="languageDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false" th:text="#{nav.language}">
                            Language
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
                            <li>
                                <a class="dropdown-item" href="?lang=en" th:text="#{nav.language.english}">
                                    English
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="?lang=fr" th:text="#{nav.language.french}">
                                    French
                                </a>
                            </li>
                        </ul>
                    </li>

                    <li class="nav-item" th:if="${!currentUserAuthenticated}">
                        <a class="nav-link" th:href="@{/login}" th:text="#{nav.login}">
                            Login
                        </a>
                    </li>

                    <li class="nav-item" th:if="${currentUserAuthenticated}">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-link nav-link px-2" th:text="#{nav.logout}">
                                Logout
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="navbar navbar-expand navbar-light bg-light border-bottom" th:if="${currentUserAdmin}">
        <div class="container">
            <span class="navbar-text me-3 fw-semibold" th:text="#{nav.adminArea}">
                Admin
            </span>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/appointments}" th:text="#{nav.appointments}">
                        Appointments
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/users}" th:text="#{nav.users}">
                        Users
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="navbar navbar-expand navbar-light bg-light border-bottom" th:if="${currentUserDoctor}">
        <div class="container">
            <span class="navbar-text me-3 fw-semibold" th:text="#{nav.doctorArea}">
                Doctor
            </span>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/doctor/schedule}" th:text="#{nav.schedule}">
                        Schedule
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="navbar navbar-expand navbar-light bg-light border-bottom" th:if="${currentUserPatient}">
        <div class="container">
            <span class="navbar-text me-3 fw-semibold" th:text="#{nav.patientArea}">
                Patient
            </span>

            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/patient/appointments}" th:text="#{nav.myAppointments}">
                        My appointments
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/patient/appointments/create}" th:text="#{nav.bookAppointment}">
                        Book appointment
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
