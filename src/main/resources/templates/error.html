<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Error')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h1 class="display-5 fw-semibold mb-3">
                        HTTP Error
                        <span th:text="${status}">500</span>
                    </h1>

                    <p class="lead text-muted mb-2" th:text="${error}">
                        Internal Server Error
                    </p>

                    <p class="text-muted mb-4" th:if="${path != null}">
                        Requested path:
                        <code th:text="${path}">/example</code>
                    </p>

                    <a class="btn btn-primary" th:href="@{/}">
                        Back to home
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
