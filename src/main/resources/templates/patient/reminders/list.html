<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{patient.reminders.list.pageTitle})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">
    <div class="mb-4">
        <h1 class="h3 mb-1" th:text="#{patient.reminders.list.heading}">
            Appointment reminders
        </h1>
        <p class="text-muted mb-0" th:text="#{patient.reminders.list.description}">
            View reminders generated for your upcoming appointments.
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(reminders)}" class="text-muted"
                 th:text="#{patient.reminders.list.empty}">
                You do not have any generated reminders.
            </div>

            <div th:unless="${#lists.isEmpty(reminders)}" class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th th:text="#{appointments.field.id}">ID</th>
                        <th th:text="#{appointments.field.doctor}">Doctor</th>
                        <th th:text="#{patient.appointments.field.specialty}">Specialty</th>
                        <th th:text="#{appointments.field.scheduledAt}">Scheduled at</th>
                        <th th:text="#{appointments.field.reason}">Reason</th>
                        <th th:text="#{appointments.field.reminderGeneratedAt}">Reminder</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="reminder : ${reminders}">
                        <td th:text="${reminder.idAppointment}">1</td>
                        <td th:text="${reminder.doctorName}">Doctor Name</td>
                        <td th:text="${reminder.doctorSpecialty}">General Medicine</td>
                        <td th:text="${#temporals.format(reminder.scheduledAt, 'yyyy-MM-dd HH:mm')}">
                            2026-06-12 10:00
                        </td>
                        <td th:text="${reminder.reason} ?: #{appointments.value.noReason}">
                            General consultation
                        </td>
                        <td th:text="${#temporals.format(reminder.reminderGeneratedAt, 'yyyy-MM-dd HH:mm')}">
                            2026-06-11 10:00
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
