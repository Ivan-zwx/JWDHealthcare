<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{patient.appointments.form.pageTitle})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">
    <div class="mb-4">
        <h1 class="h3 mb-1" th:text="#{patient.appointments.form.heading}">
            Book appointment
        </h1>
        <p class="text-muted mb-0" th:text="#{patient.appointments.form.description}">
            Choose a doctor and a full-hour appointment slot.
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:object="${patientAppointmentForm}"
                  th:action="@{/patient/appointments/create}"
                  method="post">

                <div class="mb-3">
                    <label for="doctorId" class="form-label" th:text="#{appointments.field.doctor}">
                        Doctor
                    </label>
                    <select id="doctorId" class="form-select" th:field="*{doctorId}">
                        <option value="" th:text="#{appointments.form.selectDoctor}">
                            Select doctor
                        </option>
                        <option th:each="doctor : ${doctorOptions}"
                                th:value="${doctor.idDoctor}"
                                th:text="${doctor.displayName}">
                            Doctor
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}">
                        Doctor is required.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="scheduledAt" class="form-label" th:text="#{appointments.field.scheduledAt}">
                        Scheduled at
                    </label>
                    <input id="scheduledAt" type="datetime-local" class="form-control"
                           th:field="*{scheduledAt}" step="3600">
                    <div class="form-text" th:text="#{appointments.form.slotHelp}">
                        Appointments are scheduled in one-hour slots.
                    </div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('scheduledAt')}"
                         th:errors="*{scheduledAt}">
                        Scheduled time is required.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="reason" class="form-label" th:text="#{appointments.field.reason}">
                        Reason
                    </label>
                    <textarea id="reason" class="form-control" rows="4" th:field="*{reason}"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}">
                        Reason is too long.
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{patient.appointments.action.book}">
                        Book appointment
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{/patient/appointments}"
                       th:text="#{patient.appointments.action.backToList}">
                        Back to my appointments
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
