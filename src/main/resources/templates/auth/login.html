<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{login.pageTitle})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h3 mb-3" th:text="#{login.heading}">
                        Login
                    </h1>

                    <p class="text-muted" th:text="#{login.description}">
                        Sign in with your healthcare scheduling account.
                    </p>

                    <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">
                        Invalid username or password.
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.logout}">
                        You have been signed out.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label" th:text="#{login.username}">
                                Username
                            </label>
                            <input id="username" name="username" type="text" class="form-control" autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label" th:text="#{login.password}">
                                Password
                            </label>
                            <input id="password" name="password" type="password" class="form-control">
                        </div>

                        <button type="submit" class="btn btn-primary w-100" th:text="#{login.submit}">
                            Sign in
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
