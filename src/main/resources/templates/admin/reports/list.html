<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{admin.reports.list.pageTitle})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1" th:text="#{admin.reports.list.heading}">
                Reports
            </h1>
            <p class="text-muted mb-0" th:text="#{admin.reports.list.description}">
                Generate and review appointment summary reports.
            </p>
        </div>

        <form th:action="@{/admin/reports/generate}" method="post">
            <button type="submit" class="btn btn-primary" th:text="#{admin.reports.action.generate}">
                Generate report
            </button>
        </form>
    </div>

    <div th:if="${successMessageKey}" class="alert alert-success" th:text="#{${successMessageKey}}">
        Report was generated successfully.
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(reports)}" class="text-muted" th:text="#{admin.reports.list.empty}">
                No reports have been generated yet.
            </div>

            <div th:unless="${#lists.isEmpty(reports)}">
                <div th:each="report : ${reports}" class="border rounded p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <h2 class="h5 mb-1" th:text="${report.title}">
                                Appointment Summary Report
                            </h2>
                            <div class="text-muted small">
                                <span th:text="#{admin.reports.field.id}">ID</span>
                                <span th:text="${report.idReport}">1</span>
                                <span class="mx-2">|</span>
                                <span th:text="#{admin.reports.field.generatedAt}">Generated at</span>
                                <span th:text="${#temporals.format(report.generatedAt, 'yyyy-MM-dd HH:mm')}">
                                    2026-07-30 21:55
                                </span>
                            </div>
                        </div>
                    </div>

                    <pre class="bg-light border rounded p-3 mb-0 small" th:text="${report.summary}">
Healthcare Appointment Summary
                    </pre>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
