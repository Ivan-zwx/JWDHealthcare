<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{appointments.form.pageTitle})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">
    <div class="mb-4">
        <h1 class="h3 mb-1"
            th:text="${editMode} ? #{appointments.form.heading.edit} : #{appointments.form.heading.create}">
            Appointment form
        </h1>
        <p class="text-muted mb-0" th:text="#{appointments.form.description}">
            Enter appointment details and save the appointment.
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:object="${appointmentForm}"
                  th:action="${editMode} ? @{/admin/appointments/edit/{id}(id=${appointmentForm.idAppointment})} : @{/admin/appointments/create}"
                  method="post">

                <div class="mb-3">
                    <label for="doctorId" class="form-label" th:text="#{appointments.field.doctor}">
                        Doctor
                    </label>
                    <select id="doctorId" class="form-select" th:field="*{doctorId}">
                        <option value="" th:text="#{appointments.form.selectDoctor}">
                            Select doctor
                        </option>
                        <option th:each="doctor : ${doctorOptions}"
                                th:value="${doctor.idDoctor}"
                                th:text="${doctor.displayName}">
                            Doctor
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}">
                        Doctor is required.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="patientId" class="form-label" th:text="#{appointments.field.patient}">
                        Patient
                    </label>
                    <select id="patientId" class="form-select" th:field="*{patientId}">
                        <option value="" th:text="#{appointments.form.selectPatient}">
                            Select patient
                        </option>
                        <option th:each="patient : ${patientOptions}"
                                th:value="${patient.idPatient}"
                                th:text="${patient.displayName}">
                            Patient
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('patientId')}" th:errors="*{patientId}">
                        Patient is required.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="scheduledAt" class="form-label" th:text="#{appointments.field.scheduledAt}">
                        Scheduled at
                    </label>
                    <input id="scheduledAt" type="datetime-local" class="form-control" th:field="*{scheduledAt}" step="3600">
                    <div class="form-text" th:text="#{appointments.form.slotHelp}">
                        Appointments are scheduled in one-hour slots.
                    </div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('scheduledAt')}" th:errors="*{scheduledAt}">
                        Scheduled time is required.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label" th:text="#{appointments.field.status}">
                        Status
                    </label>
                    <select id="status" class="form-select" th:field="*{status}">
                        <option th:each="status : ${statusOptions}"
                                th:value="${status}"
                                th:text="#{appointment.status.__${status.name()}__}">
                            SCHEDULED
                        </option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">
                        Status is required.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="reason" class="form-label" th:text="#{appointments.field.reason}">
                        Reason
                    </label>
                    <textarea id="reason" class="form-control" rows="4" th:field="*{reason}"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}">
                        Reason is too long.
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{appointments.action.save}">
                        Save
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/appointments}"
                       th:text="#{appointments.action.backToList}">
                        Back to list
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
