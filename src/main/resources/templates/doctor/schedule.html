<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{doctor.schedule.pageTitle})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">
    <div class="mb-4">
        <h1 class="h3 mb-1" th:text="#{doctor.schedule.heading}">
            My schedule
        </h1>
        <p class="text-muted mb-0" th:text="#{doctor.schedule.description}">
            View your assigned appointments and update medical records.
        </p>
    </div>

    <div th:if="${successMessageKey}" class="alert alert-success" th:text="#{${successMessageKey}}">
        Medical record was saved successfully.
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(appointments)}" class="text-muted"
                 th:text="#{doctor.schedule.empty}">
                You do not have any assigned appointments yet.
            </div>

            <div th:unless="${#lists.isEmpty(appointments)}" class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th th:text="#{appointments.field.id}">ID</th>
                        <th th:text="#{doctor.schedule.field.patient}">Patient</th>
                        <th th:text="#{appointments.field.scheduledAt}">Scheduled at</th>
                        <th th:text="#{appointments.field.status}">Status</th>
                        <th th:text="#{appointments.field.reason}">Reason</th>
                        <th class="text-end" th:text="#{appointments.field.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="appointment : ${appointments}">
                        <td th:text="${appointment.idAppointment}">1</td>
                        <td th:text="${appointment.patientName}">Patient Name</td>
                        <td th:text="${#temporals.format(appointment.scheduledAt, 'yyyy-MM-dd HH:mm')}">
                            2026-06-12 10:00
                        </td>
                        <td>
                            <span class="badge bg-secondary"
                                  th:text="#{appointment.status.__${appointment.status.name()}__}">
                                SCHEDULED
                            </span>
                        </td>
                        <td th:text="${appointment.reason} ?: #{appointments.value.noReason}">
                            General consultation
                        </td>
                        <td class="text-end">
                            <a th:if="${appointment.recordEditable}"
                               class="btn btn-sm btn-outline-primary"
                               th:href="@{/doctor/appointments/{id}/record(id=${appointment.idAppointment})}"
                               th:text="#{doctor.schedule.action.medicalRecord}">
                                Medical record
                            </a>

                            <span th:unless="${appointment.recordEditable}"
                                  class="text-muted small"
                                  th:text="#{doctor.schedule.value.recordUnavailable}">
                                Not available
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
