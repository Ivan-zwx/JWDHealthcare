<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{medicalRecord.form.pageTitle})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container mt-5">
    <div class="mb-4">
        <h1 class="h3 mb-1" th:text="#{medicalRecord.form.heading}">
            Medical record
        </h1>
        <p class="text-muted mb-0" th:text="#{medicalRecord.form.description}">
            Enter or update medical record details for the selected appointment.
        </p>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3" th:text="#{medicalRecord.appointment.heading}">
                Appointment details
            </h2>

            <dl class="row mb-0">
                <dt class="col-sm-3" th:text="#{appointments.field.id}">ID</dt>
                <dd class="col-sm-9" th:text="${appointment.idAppointment}">1</dd>

                <dt class="col-sm-3" th:text="#{doctor.schedule.field.patient}">Patient</dt>
                <dd class="col-sm-9" th:text="${appointment.patientName}">Patient Name</dd>

                <dt class="col-sm-3" th:text="#{appointments.field.scheduledAt}">Scheduled at</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(appointment.scheduledAt, 'yyyy-MM-dd HH:mm')}">
                    2026-06-12 10:00
                </dd>

                <dt class="col-sm-3" th:text="#{appointments.field.status}">Status</dt>
                <dd class="col-sm-9" th:text="#{appointment.status.__${appointment.status.name()}__}">
                    Scheduled
                </dd>

                <dt class="col-sm-3" th:text="#{appointments.field.reason}">Reason</dt>
                <dd class="col-sm-9" th:text="${appointment.reason} ?: #{appointments.value.noReason}">
                    General consultation
                </dd>
            </dl>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:object="${medicalRecordForm}"
                  th:action="@{/doctor/appointments/{id}/record(id=${appointment.idAppointment})}"
                  method="post">

                <div class="mb-3">
                    <label for="diagnosis" class="form-label" th:text="#{medicalRecord.field.diagnosis}">
                        Diagnosis
                    </label>
                    <textarea id="diagnosis" class="form-control" rows="3" th:field="*{diagnosis}"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('diagnosis')}"
                         th:errors="*{diagnosis}">
                        Diagnosis is too long.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="treatment" class="form-label" th:text="#{medicalRecord.field.treatment}">
                        Treatment
                    </label>
                    <textarea id="treatment" class="form-control" rows="3" th:field="*{treatment}"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('treatment')}"
                         th:errors="*{treatment}">
                        Treatment is too long.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="notes" class="form-label" th:text="#{medicalRecord.field.notes}">
                        Notes
                    </label>
                    <textarea id="notes" class="form-control" rows="4" th:field="*{notes}"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}">
                        Notes are too long.
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{medicalRecord.action.save}">
                        Save record
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{/doctor/schedule}"
                       th:text="#{medicalRecord.action.backToSchedule}">
                        Back to schedule
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
